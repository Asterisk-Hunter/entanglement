<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2f0ff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="26"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-the-bet"
        class="scene"
        data-composition-id="01-the-bet"
        data-composition-src="compositions/frames/01-the-bet.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-02-one-round"
        class="scene"
        data-composition-id="02-one-round"
        data-composition-src="compositions/frames/02-one-round.html"
        data-start="3"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-the-reversal"
        class="scene"
        data-composition-id="03-the-reversal"
        data-composition-src="compositions/frames/03-the-reversal.html"
        data-start="7"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-why"
        class="scene"
        data-composition-id="04-why"
        data-composition-src="compositions/frames/04-why.html"
        data-start="12"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-the-floor"
        class="scene"
        data-composition-id="05-the-floor"
        data-composition-src="compositions/frames/05-the-floor.html"
        data-start="17"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-honesty-cta"
        class="scene"
        data-composition-id="06-honesty-cta"
        data-composition-src="compositions/frames/06-honesty-cta.html"
        data-start="22"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
