<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entanglement Trap source crops</title>
  <link rel="stylesheet" href="../../../main.css">
  <style>
    :root { --body-size: 28px; --label-size: 28px; --title: 30px; --readout-size: 30px; --readout-sm: 28px; --meta-mono-size: 28px; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b0e14; }
    body { max-width: none; padding: 64px 72px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #source { width: 1120px; }
    header, footer, .skip, #announcer { display: none !important; }
    main { max-width: none; padding: 0; }
    section { border: 0; padding: 0; }
    #surprise { display: block; }
    #hero, #surprise-label { display: none; }
    #round-form fieldset { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 30px; }
    #round-form legend { grid-column: 1 / -1; font-size: 28px; margin-bottom: 8px; }
    .probe { min-height: 78px; margin: 0; font-size: 28px; padding: 18px 22px; }
    .probe input { width: 24px; height: 24px; }
    #round-form .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .setting .label { font-size: 28px; }
    #round-form select, #round-form button { min-height: 76px; font-size: 28px; }
    #run-state { margin-top: 26px; font-size: 28px; }
    #round-outcome, #round-narrative { display: none; }
    body[data-shot="round"] #round-outcome { display: block; margin: 18px 0 0; font-size: 28px; }
    #benchmark-readout { white-space: pre-wrap; font-size: 28px; line-height: 1.35; margin: 20px 0; }
    #impact { display: block !important; max-width: 1000px; font-size: 38px; line-height: 1.12; color: var(--accent); }
    #mechanism { display: block !important; }
    #mechanism .body { font-size: 28px; }
    .ledger { max-width: 1000px; grid-template-columns: 360px 1fr; gap: 10px 32px; }
    .ledger dt { font-size: 28px; }
    .ledger dd { font-size: 28px; }
    #sweep-figure { display: block; width: 1120px; margin: 0; }
    #sweep-figure figcaption { font-size: 28px; }
    #sweep { padding: 0; min-width: 0; }
    .sweepview { width: 1120px; height: auto; }
    .sw-value { font-size: 19px !important; }
    .sw-tick-label, .sw-kind, .sw-note, .sw-column-label { font-size: 19px !important; }
    #proof, #understanding, #resource-lab { display: none; }
    body[data-shot="benchmark"] #understanding,
    body[data-shot="mechanism"] #understanding,
    body[data-shot="sweep"] #proof { display: block !important; }
    body[data-shot="benchmark"] #understanding > :not(#benchmark-readout):not(#impact) { display: none !important; }
    body[data-shot="mechanism"] #understanding > :not(#mechanism) { display: none !important; }
    body[data-shot="sweep"] #proof > :not(#sweep-figure) { display: none !important; }
    .crop-note { position: absolute; right: 74px; top: 76px; width: 570px; padding-left: 30px; border-left: 1px solid #333d4c; color: #a3adbb; font: 22px/1.5 ui-monospace, monospace; }
    .crop-note { display: none; }
    .crop-note strong { display: block; color: #e9b44c; font-size: 20px; letter-spacing: .12em; margin-bottom: 18px; }
    .claim { color: #f2f0ff; font-size: 28px; line-height: 1.4; }
    .tag { color: #e9b44c; font-size: 28px; letter-spacing: .1em; }
    body[data-shot="floor"] #source,
    body[data-shot="floor"] #note { display: none; }
    .floor-panel { width: 1000px; border-left: 2px solid #e9b44c; padding: 8px 32px 20px; }
    .floor-label { color: #e9b44c; font: 700 28px/1.3 ui-monospace, monospace; letter-spacing: .14em; }
    .floor-value { color: #f2f0ff; font: 700 64px/1.15 ui-monospace, monospace; margin: 22px 0 10px; }
    .floor-copy { color: #a3adbb; font: 28px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="source"></div>
  <aside class="crop-note" id="note"></aside>
  <script type="module">
    import { mountSweep } from "../../../ui/sweep.js";

    const params = new URLSearchParams(location.search);
    const kind = params.get("shot") || "bet";
    document.body.dataset.shot = kind;
    const response = await fetch("../../../index.html");
    document.getElementById("source").innerHTML = await response.text();
    const note = document.getElementById("note");
    if (kind === "floor") {
      document.body.insertAdjacentHTML("beforeend", '<section class="floor-panel"><div class="floor-label">HELSTROM · THEORETICAL CEILING</div><div class="floor-value">0.5623778102448098</div><div class="floor-copy">Even the optimal detector is bounded here.<br>THEORETICAL_CEILING · not a measured run value.</div></section>');
    } else {
    const max = document.getElementById("probe-me");
    const sep = document.getElementById("probe-sep");
    document.getElementById("dimension").value = "256";
    document.getElementById("trials").value = "2000";

    if (kind === "bet") {
      max.checked = true;
      note.innerHTML = '<strong>ENTANGLEMENT TRAP / THE BET</strong><span class="claim">Two probes. One hidden channel. Which one wins?</span>';
    } else if (kind === "round") {
      max.checked = true;
      document.getElementById("run").textContent = "PLAY ONE ROUND";
      document.getElementById("run-state").textContent = "QOLLAB PROJECT RUN · ONE BACKEND JOB BUDGET";
      document.getElementById("round-outcome").textContent = "ROUND COMPLETE · ONE OUTCOME · SINGLE QUERY";
      document.getElementById("run").dataset.pressed = "true";
      note.innerHTML = '<strong>ONE ROUND / ONE JOB</strong><span class="claim">d = 256<br>2,000 shots / channel<br>One backend job. Cached evidence after.</span><p class="tag">SOURCE: QOLLAB · BACKEND JOBS=1</p>';
    } else if (kind === "benchmark") {
      sep.checked = true;
      const readout = document.getElementById("benchmark-readout");
      readout.textContent = "ANALYTIC EXECUTABLE VALUES · d=256\nMAX_ENTANGLEMENT   0.507781982421875\nSEPARABLE          1.0000";
      const impact = document.getElementById("impact");
      impact.hidden = false;
      impact.textContent = "MORE ENTANGLEMENT MADE YOU WORSE.";
      note.innerHTML = '<strong>THE REVERSAL</strong><span class="claim">Same task.<br>Same dimension.<br>Opposite result.</span><p class="tag">BOTH READOUTS: ANALYTIC</p>';
      document.getElementById("surprise").style.display = "none";
      document.getElementById("understanding").hidden = false;
    } else if (kind === "mechanism") {
      document.getElementById("mechanism").hidden = false;
      document.querySelector('#mechanism dt:nth-of-type(2)').textContent = "SIGNED OUTPUT OVERLAP";
      document.getElementById("mechanism-overlap").textContent = "-0.9921875";
      document.getElementById("mechanism-entanglement").textContent = "MAXIMAL";
      document.getElementById("mechanism-success").textContent = "0.507781982421875 · ANALYTIC";
      const traceLabel = document.querySelector('#mechanism dt:nth-of-type(3)');
      traceLabel.nextElementSibling.remove();
      traceLabel.remove();
      note.innerHTML = '<strong>WHY THE RESULT FLIPS</strong><span class="claim">The probes stay maximally entangled. The two possible outputs nearly coincide.</span><p class="tag">SIGNED OVERLAP · ANALYTIC</p>';
      document.getElementById("surprise").style.display = "none";
      document.getElementById("understanding").hidden = false;
    } else if (kind === "sweep") {
      document.getElementById("surprise").style.display = "none";
      document.getElementById("understanding").hidden = false;
      document.getElementById("proof").style.display = "block";
      mountSweep(document.getElementById("sweep"), document.getElementById("sweep-values"));
      const svg = document.querySelector("#sweep svg");
      svg.setAttribute("viewBox", "120 40 620 320");
      svg.querySelectorAll('[data-d="2"], [data-d="1024"]').forEach((node) => node.remove());
      svg.querySelector('[data-role="legend"]').remove();
      svg.querySelectorAll("text.sw-kind").forEach((node) => node.remove());
      svg.querySelectorAll('[data-role="ceiling-mark"], [data-role="ceiling-value"], [data-role="chance-label"]').forEach((node) => node.remove());
      svg.querySelector('[data-d="256"] [data-role="simple-value"]').remove();
      svg.querySelector('[data-d="64"] [data-role="simple-value"]').remove();
      document.getElementById("sweep-caption").textContent = "ANALYTIC EXECUTABLE VALUES · d = 4, 16, 64, 256";
      note.innerHTML = '<strong>THE SWEEP / ANALYTIC</strong><span class="claim">Separable stays flat.<br>Maximum-entanglement falls toward chance.</span><p class="tag">d=4 → 0.875<br>d=16 → 0.6171875<br>d=64 → 0.53076171875</p>';
    }
    }
  </script>
</body>
</html>
